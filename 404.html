<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — Canil Theos Ho Pater</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/styles.css">
<style>
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #131F38, #1B2A4A); color: #F5F1E8; text-align: center; padding: 2rem; }
.err-content { max-width: 500px; }
.err-num { font-family: 'Cormorant Garamond', serif; font-size: 8rem; color: #C9A84C; line-height: 1; font-style: italic; margin-bottom: 1rem; }
.err-title { font-family: 'Cormorant Garamond', serif; font-size: 2rem; margin-bottom: 1rem; }
.err-text { color: rgba(245, 241, 232, 0.7); margin-bottom: 2rem; line-height: 1.7; }
.err-btn { display: inline-flex; align-items: center; gap: 0.8rem; background: #C9A84C; color: #131F38; padding: 1rem 2.5rem; text-decoration: none; font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500; transition: transform 0.3s; }
.err-btn:hover { transform: translateY(-2px); }
</style>
</head>
<body>
<div class="err-content">
    <div class="err-num">404</div>
    <h1 class="err-title">Página não encontrada</h1>
    <p class="err-text">Parece que esse caminho não existe. Mas que tal voltar e conhecer nossos filhotes?</p>
    <a href="/" class="err-btn">Voltar ao início</a>
</div>
</body>
</html>
